name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o sx_linux_amd64 .
          GOOS=linux GOARCH=arm64 go build -o sx_linux_arm64 .
          sha256sum sx_linux_amd64 sx_linux_arm64 > SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
